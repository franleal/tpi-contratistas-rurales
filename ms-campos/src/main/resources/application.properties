spring.application.name=ms-campos
server.port=${SERVER_PORT:8082}

# Conexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=campos}
spring.datasource.username=${DB_USER:campos_app}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# CI de pull requests: compila y corre las pruebas de todo el monorepo.
# No despliega ni hace merge: la aprobación final sigue siendo manual (ver README).
name: CI Maven

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El pom agregador de la raíz construye agro-commons primero y después los servicios
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f infra/compose/docker-compose.falla-meteo.yml config --quiet
          docker compose -f docker-compose.yml -f infra/compose/docker-compose.falla-georef.yml config --quiet

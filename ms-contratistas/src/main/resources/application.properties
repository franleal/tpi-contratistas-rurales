spring.application.name=ms-contratistas
server.port=${SERVER_PORT:8083}

# Conexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=contratistas}
spring.datasource.username=${DB_USER:contratistas_app}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
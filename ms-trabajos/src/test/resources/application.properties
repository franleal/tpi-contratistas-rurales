# Pruebas: H2 en memoria en modo PostgreSQL, sin data.sql ni Keycloak real
spring.datasource.url=jdbc:h2:mem:trabajos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS trabajos\\;SET SCHEMA trabajos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=trabajos
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/agro
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/certs
# Este archivo reemplaza al application.properties principal en las pruebas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false
# Dependencias: en las pruebas se simulan (MockRestServiceServer o @MockitoBean)
services.campos.url=http://campos.test
services.contratistas.url=http://contratistas.test
open-meteo.url=http://open-meteo.test
http.connect-timeout-ms=500
http.read-timeout-ms=500
traslado.factor-ruta=1.3
traslado.velocidad-kmh=40

spring.application.name=ms-trabajos
server.port=${SERVER_PORT:8084}

# Conexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=trabajos}
spring.datasource.username=${DB_USER:trabajos_app}
spring.datasource.password=${DB_PASSWORD}
# Esquema propio del servicio (el usuario solo tiene permisos sobre este esquema)
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:trabajos}

# Configuracion JPA
# Perfil de demostración: Hibernate recrea las tablas al arrancar y data.sql carga los datos
# de prueba (con fechas relativas a CURRENT_DATE). Para conservar datos: DDL_AUTO=update y SQL_INIT_MODE=never.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Keycloak - validacion del JWT en el servicio (issuer publico, claves por la red interna)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/agro}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/realms/agro/protocol/openid-connect/certs}

# Salud: /actuator/health lo usa el healthcheck de Docker Compose (sin detalles hacia afuera)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logs: cada linea lleva el correlation ID de la peticion (X-Correlation-Id, ver CorrelationIdFilter)
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.ar.edu.tpi=INFO

# Servicios internos y Open-Meteo
services.campos.url=${CAMPOS_URL:http://localhost:8082}
services.contratistas.url=${CONTRATISTAS_URL:http://localhost:8083}
open-meteo.url=${OPEN_METEO_URL:https://api.open-meteo.com}
http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:2000}
http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:8000}

# Traslado (RN-12): horas = Haversine(km) x factor / velocidad
traslado.factor-ruta=${TRASLADO_FACTOR_RUTA:1.3}
traslado.velocidad-kmh=${TRASLADO_VELOCIDAD_KMH:40}

# OpenAPI (las rutas /internal se ocultan en OpenApiConfig)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Destinos de los microservicios
services.campos.url=${CAMPOS_URL:http://localhost:8082}
services.contratistas.url=${CONTRATISTAS_URL:http://localhost:8083}
services.trabajos.url=${TRABAJOS_URL:http://localhost:8084}

# Keycloak - Validacion JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/agro}

# Salud: /actuator/health lo usa el healthcheck de Docker Compose (sin detalles hacia afuera)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Swagger UI unificado en http://localhost:8080/swagger-ui.html (el Gateway no tiene API propia)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=ms-campos
springdoc.swagger-ui.urls[0].url=/campos/v3/api-docs
springdoc.swagger-ui.urls[1].name=ms-contratistas
springdoc.swagger-ui.urls[1].url=/contratistas/v3/api-docs
springdoc.swagger-ui.urls[2].name=ms-trabajos
springdoc.swagger-ui.urls[2].url=/trabajos/v3/api-docs

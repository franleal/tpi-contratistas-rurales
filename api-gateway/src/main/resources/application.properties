spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Destinos de los microservicios
services.campos.url=${CAMPOS_URL:http://localhost:8082}
services.contratistas.url=${CONTRATISTAS_URL:http://localhost:8083}
services.trabajos.url=${TRABAJOS_URL:http://localhost:8084}

# Keycloak - Validacion JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/agro}

# Salud: /actuator/health lo usa el healthcheck de Docker Compose (sin detalles hacia afuera)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

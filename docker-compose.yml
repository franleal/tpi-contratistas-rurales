# Plataforma de Contratistas Rurales - entorno completo de demostración.
#
# Trusted zone: solo el Gateway (8080) y Keycloak (8081, login) publican puertos, y solo
# en 127.0.0.1. Los tres microservicios y PostgreSQL quedan en la red interna sin puertos
# expuestos. Los servicios necesitan salida a Internet para Georef y Open-Meteo, por eso la
# red es un bridge común (no "internal: true").
#
# Variables y secretos: .env (copiar desde .env.example). Ver README.

x-servicio-java: &servicio-java
  restart: unless-stopped
  networks:
    - interna

services:

  postgres:
    image: postgres:16
    container_name: agro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      CAMPOS_DB_PASSWORD: ${CAMPOS_DB_PASSWORD}
      CONTRATISTAS_DB_PASSWORD: ${CONTRATISTAS_DB_PASSWORD}
      TRABAJOS_DB_PASSWORD: ${TRABAJOS_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - interna

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: agro-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/postgres
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Hostname fijo: el issuer (iss) de los tokens es siempre http://localhost:8081/realms/agro,
      # el mismo que validan el Gateway y los servicios aunque pidan las claves por la red interna.
      KC_HOSTNAME: http://localhost:8081
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/agro-realm.json:/opt/keycloak/data/import/agro-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna

  ms-campos:
    <<: *servicio-java
    build:
      context: .
      dockerfile: ms-campos/Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=campos
      DB_USER: campos_app
      DB_PASSWORD: ${CAMPOS_DB_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      GEOREF_URL: ${GEOREF_URL:-https://apis.datos.gob.ar/georef/api}
      HTTP_CONNECT_TIMEOUT_MS: ${HTTP_CONNECT_TIMEOUT_MS:-2000}
      HTTP_READ_TIMEOUT_MS: ${HTTP_READ_TIMEOUT_MS:-8000}
      DDL_AUTO: ${DDL_AUTO:-create}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy

  ms-contratistas:
    <<: *servicio-java
    build:
      context: .
      dockerfile: ms-contratistas/Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=contratistas
      DB_USER: contratistas_app
      DB_PASSWORD: ${CONTRATISTAS_DB_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      DDL_AUTO: ${DDL_AUTO:-create}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy

  ms-trabajos:
    <<: *servicio-java
    build:
      context: .
      dockerfile: ms-trabajos/Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=trabajos
      DB_USER: trabajos_app
      DB_PASSWORD: ${TRABAJOS_DB_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      CAMPOS_URL: http://ms-campos:8080
      CONTRATISTAS_URL: http://ms-contratistas:8080
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com}
      HTTP_CONNECT_TIMEOUT_MS: ${HTTP_CONNECT_TIMEOUT_MS:-2000}
      HTTP_READ_TIMEOUT_MS: ${HTTP_READ_TIMEOUT_MS:-8000}
      TRASLADO_FACTOR_RUTA: ${TRASLADO_FACTOR_RUTA:-1.3}
      TRASLADO_VELOCIDAD_KMH: ${TRASLADO_VELOCIDAD_KMH:-40}
      DDL_AUTO: ${DDL_AUTO:-create}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *servicio-java
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      CAMPOS_URL: http://ms-campos:8080
      CONTRATISTAS_URL: http://ms-contratistas:8080
      TRABAJOS_URL: http://ms-trabajos:8080
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - keycloak
      - ms-campos
      - ms-contratistas
      - ms-trabajos

volumes:
  pgdata:

networks:
  interna:
    driver: bridge

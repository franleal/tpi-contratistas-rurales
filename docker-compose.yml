services:

  postgres:
    image: postgres:16
    container_name: agro-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

      CAMPOS_DB_PASSWORD: ${CAMPOS_DB_PASSWORD}
      CONTRATISTAS_DB_PASSWORD: ${CONTRATISTAS_DB_PASSWORD}
      TRABAJOS_DB_PASSWORD: ${TRABAJOS_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - interna

volumes:
  pgdata:

networks:
  interna:
    driver: bridge
